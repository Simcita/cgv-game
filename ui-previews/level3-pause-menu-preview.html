<!DOCTYPE html>
<html>
<head>
<title>Level 3 Pause Menu Preview</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #2c3e50 0%, #34495e 50%, #2c3e50 100%);
    font-family: 'Arial', sans-serif;
  }
  
  .preview-container {
    background: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 15px;
    max-width: 800px;
    margin: 0 auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  
  h1 { color: #2c3e50; text-align: center; }
  
  .pause-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(6px);
  }
  
  .pause-container {
    background: linear-gradient(145deg, #8b7355 0%, #6b5d4f 100%);
    border: 6px solid #d4af37;
    border-radius: 50%;
    width: 500px;
    height: 500px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 
      0 0 60px rgba(212, 175, 55, 0.6),
      inset 0 0 40px rgba(0,0,0,0.3),
      0 0 0 8px #8b7355;
    position: relative;
    font-family: 'Arial', sans-serif;
  }
  
  .clock-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
  }
  
  .clock-markers {
    position: absolute;
    width: 100%;
    height: 100%;
  }
  
  .marker {
    position: absolute;
    background: #d4af37;
    border-radius: 2px;
  }
  
  .marker.hour {
    width: 6px;
    height: 40px;
  }
  
  .marker.minute {
    width: 3px;
    height: 20px;
  }
  
  .clock-hands {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
  }
  
  .hand {
    position: absolute;
    background: #c0392b;
    border-radius: 3px;
    transform-origin: bottom center;
    left: 50%;
    bottom: 50%;
  }
  
  .hour-hand {
    width: 8px;
    height: 100px;
    transform: translateX(-50%) rotate(90deg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  
  .minute-hand {
    width: 5px;
    height: 140px;
    background: #d4af37;
    transform: translateX(-50%) rotate(180deg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  
  .center-dot {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #d4af37;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
    z-index: 10;
  }
  
  .menu-content {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 40px;
  }
  
  .title {
    color: #d4af37;
    font-size: 36px;
    margin: 20px 0 10px 0;
    text-shadow: 
      2px 2px 0px #8b6914,
      0 0 20px rgba(212, 175, 55, 0.8);
    letter-spacing: 3px;
    font-weight: bold;
  }
  
  .subtitle {
    color: #f5f5dc;
    font-size: 16px;
    margin-bottom: 25px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  }
  
  .controls-info {
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid #d4af37;
    border-radius: 15px;
    padding: 15px;
    margin: 20px 0;
    text-align: left;
    backdrop-filter: blur(5px);
  }
  
  .controls-info h3 {
    color: #d4af37;
    margin: 0 0 10px 0;
    font-size: 18px;
    text-align: center;
  }
  
  .controls-info p {
    color: #f5f5dc;
    margin: 6px 0;
    font-size: 14px;
  }
  
  .button {
    padding: 12px 30px;
    margin: 8px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  
  .button-resume {
    background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    color: white;
    border: 2px solid #1e8449;
  }
  
  .button-resume:hover {
    background: linear-gradient(135deg, #229954 0%, #27ae60 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(46, 204, 113, 0.5);
  }
  
  .button-restart {
    background: linear-gradient(135deg, #3498db 0%, #5dade2 100%);
    color: white;
    border: 2px solid #2874a6;
  }
  
  .button-restart:hover {
    background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(52, 152, 219, 0.5);
  }
  
  @keyframes tick {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    50% { transform: translateX(-50%) rotate(360deg); }
  }
  
  .hour-hand {
    animation: tick 43200s linear infinite;
  }
  
  .minute-hand {
    animation: tick 3600s linear infinite;
  }
</style>
</head>
<body>
  <div class="preview-container">
    <h1>Level 3 Pause Menu Preview</h1>
    <p style="text-align: center; color: #666;">Clock-themed pause menu for the Clocktower level</p>
    
    <div class="pause-overlay">
      <div class="pause-container">
        <div class="clock-face">
          <!-- Clock markers -->
          <div class="clock-markers"></div>
          
          <!-- Clock hands -->
          <div class="clock-hands">
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
          </div>
          
          <div class="center-dot"></div>
        </div>
        
        <div class="menu-content">
          <h2 class="title">🕐 PAUSED 🕐</h2>
          <p class="subtitle">Time Stands Still</p>
          
          <div class="controls-info">
            <h3>⏰ Clocktower Controls</h3>
            <p>WASD - Move</p>
            <p>Mouse Drag - Rotate Camera</p>
            <p>Mouse Wheel - Zoom</p>
            <p>Space - Jump</p>
            <p>O - Pause/Resume</p>
          </div>
          
          <div>
            <button class="button button-resume">▶ Resume</button>
            <button class="button button-restart">↻ Restart</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Create clock markers
    const markersContainer = document.querySelector('.clock-markers');
    for (let i = 0; i < 12; i++) {
      const marker = document.createElement('div');
      marker.className = 'marker hour';
      const angle = (i * 30) - 90;
      const radius = 200;
      const x = 250 + radius * Math.cos(angle * Math.PI / 180);
      const y = 250 + radius * Math.sin(angle * Math.PI / 180);
      marker.style.left = x + 'px';
      marker.style.top = y + 'px';
      marker.style.transform = `translate(-50%, -50%) rotate(${angle + 90}deg)`;
      markersContainer.appendChild(marker);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Level 1 Pause Menu Preview</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #87CEEB 0%, #98D8E8 50%, #B0E0E6 100%);
    font-family: 'Arial', sans-serif;
  }
  
  .preview-container {
    background: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 15px;
    max-width: 800px;
    margin: 0 auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  
  h1 { color: #2c3e50; text-align: center; }
  
  .pause-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }
  
  .pause-container {
    background: linear-gradient(145deg, #f5f5dc 0%, #f0e68c 100%);
    border: 4px solid #8b6914;
    border-radius: 20px;
    padding: 40px 50px;
    box-shadow: 
      0 20px 60px rgba(0,0,0,0.4),
      inset 0 0 20px rgba(255,255,255,0.3),
      0 0 0 4px #d4af37;
    text-align: center;
    max-width: 500px;
    position: relative;
    font-family: 'Arial', sans-serif;
  }
  
  .compass-decoration {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    border: 6px solid #d4af37;
    border-radius: 50%;
    background: linear-gradient(135deg, #f5f5dc 0%, #f0e68c 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
  
  .compass-needle {
    width: 3px;
    height: 30px;
    background: #c0392b;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    border-radius: 2px;
  }
  
  .title {
    color: #8b6914;
    font-size: 42px;
    margin: 30px 0 10px 0;
    text-shadow: 3px 3px 0px #654321, 5px 5px 10px rgba(0,0,0,0.3);
    letter-spacing: 4px;
    font-weight: bold;
  }
  
  .subtitle {
    color: #654321;
    font-size: 18px;
    margin-bottom: 30px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  
  .controls-info {
    background: rgba(255, 255, 255, 0.6);
    border: 2px dashed #8b6914;
    border-radius: 10px;
    padding: 20px;
    margin: 25px 0;
    text-align: left;
  }
  
  .controls-info h3 {
    color: #8b6914;
    margin: 0 0 15px 0;
    font-size: 20px;
  }
  
  .controls-info p {
    color: #654321;
    margin: 8px 0;
    font-size: 16px;
  }
  
  .button {
    padding: 15px 35px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  
  .button-resume {
    background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    color: white;
    border: 3px solid #1e8449;
  }
  
  .button-resume:hover {
    background: linear-gradient(135deg, #229954 0%, #27ae60 100%);
    transform: translateY(-2px);
    box-shadow: 0 7px 20px rgba(46, 204, 113, 0.4);
  }
  
  .button-restart {
    background: linear-gradient(135deg, #3498db 0%, #5dade2 100%);
    color: white;
    border: 3px solid #2874a6;
  }
  
  .button-restart:hover {
    background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
    transform: translateY(-2px);
    box-shadow: 0 7px 20px rgba(52, 152, 219, 0.4);
  }
  
  .adventure-border {
    position: absolute;
    border: 3px solid #d4af37;
    border-radius: 15px;
  }
  
  .adventure-border.top-left {
    top: -5px;
    left: -5px;
    width: 40px;
    height: 40px;
    border-right: none;
    border-bottom: none;
    background: rgba(212, 175, 55, 0.3);
  }
  
  .adventure-border.top-right {
    top: -5px;
    right: -5px;
    width: 40px;
    height: 40px;
    border-left: none;
    border-bottom: none;
    background: rgba(212, 175, 55, 0.3);
  }
  
  .adventure-border.bottom-left {
    bottom: -5px;
    left: -5px;
    width: 40px;
    height: 40px;
    border-right: none;
    border-top: none;
    background: rgba(212, 175, 55, 0.3);
  }
  
  .adventure-border.bottom-right {
    bottom: -5px;
    right: -5px;
    width: 40px;
    height: 40px;
    border-left: none;
    border-top: none;
    background: rgba(212, 175, 55, 0.3);
  }
</style>
</head>
<body>
  <div class="preview-container">
    <h1>Level 1 Pause Menu Preview</h1>
    <p style="text-align: center; color: #666;">Adventure-themed pause menu matching Level 1's low-poly aesthetic</p>
    
    <div class="pause-overlay">
      <div class="pause-container">
        <div class="adventure-border top-left"></div>
        <div class="adventure-border top-right"></div>
        <div class="adventure-border bottom-left"></div>
        <div class="adventure-border bottom-right"></div>
        
        <div class="compass-decoration">
          <div class="compass-needle"></div>
        </div>
        
        <h2 class="title">⏸ PAUSED ⏸</h2>
        <p class="subtitle">Press 'O' to Resume</p>
        
        <div class="controls-info">
          <h3>🎮 Adventure Controls</h3>
          <p>WASD - Move</p>
          <p>Mouse Drag - Rotate Camera</p>
          <p>Mouse Wheel - Zoom</p>
          <p>Space - Jump</p>
          <p>E - Enter Portal</p>
          <p>O - Pause/Resume</p>
        </div>
        
        <div>
          <button class="button button-resume">▶ Resume</button>
          <button class="button button-restart">↻ Restart</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
